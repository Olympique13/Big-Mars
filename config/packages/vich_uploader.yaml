vich_uploader:
  db_driver: orm
  metadata:
    type: attribute
  mappings:
    event:
      uri_prefix: /images/events
      upload_destination: '%kernel.project_dir%/public/upload/images/event'
      namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
    bg_event:
      uri_prefix: /images/bgEvents
      upload_destination: '%kernel.project_dir%/public/upload/images/bgEvent'
      namer: Vich\UploaderBundle\Naming\SmartUniqueNamer